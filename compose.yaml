name: gridpulse

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg2://grid:grid-demo@postgres:5432/grid
  DATA_DIR: /data
  PYTHONPATH: /app
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  HOUSEHOLDS: ${HOUSEHOLDS:-50}
  SIM_DAY_SECONDS: ${SIM_DAY_SECONDS:-300}
  EMIT_SECONDS: ${EMIT_SECONDS:-2}
  SIM_START_DATE: ${SIM_START_DATE:-2026-01-01}
  SPARK_LOCAL_IP: 127.0.0.1

x-airflow: &airflow
  image: gridpulse-airflow:local
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    <<: *app-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://grid:grid-demo@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL: "0"
    AIRFLOW__WEBSERVER__SECRET_KEY: local-coursework-demo-key
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
  volumes:
    - airflow-logs:/opt/airflow/logs
    - ./grid:/app/grid:ro
    - ./dags:/opt/airflow/dags:ro

services:
  postgres:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_USER: grid
      POSTGRES_PASSWORD: grid-demo
      POSTGRES_DB: grid
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U grid -d grid"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-storage-init:
    image: apache/kafka:3.9.1
    user: "0:0"
    entrypoint: [sh, -c, "chown 1000:1000 /kafka-data"]
    volumes: ["kafka-data:/kafka-data"]

  kafka:
    image: apache/kafka:3.9.1
    depends_on:
      kafka-storage-init: {condition: service_completed_successfully}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [/opt/kafka/bin/kafka-topics.sh]
    command: [--bootstrap-server, "kafka:9092", --create, --if-not-exists, --topic, meter-readings, --partitions, "3", --replication-factor, "1"]

  data-init:
    image: gridpulse-app:local
    build: {context: ., target: app}
    environment: *app-environment
    volumes: ["grid-data:/data"]
    depends_on:
      postgres: {condition: service_healthy}
    command: [sh, -c, "mkdir -p /data/raw /data/tariffs /data/checkpoints && chmod -R 0777 /data && python -c 'from grid.store import engine, init; init(engine())'"]

  meters:
    image: gridpulse-app:local
    build: {context: ., target: app}
    environment: *app-environment
    volumes: ["./grid:/app/grid:ro"]
    depends_on:
      data-init: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
    command: [python, -m, grid.simulators, meters]
    restart: unless-stopped

  tariffs:
    image: gridpulse-app:local
    build: {context: ., target: app}
    environment: *app-environment
    volumes: ["grid-data:/data"]
    depends_on:
      data-init: {condition: service_completed_successfully}
    command: [python, -m, grid.simulators, tariffs]
    restart: unless-stopped

  stream:
    image: gridpulse-spark:local
    build: {context: ., target: spark}
    environment:
      <<: *app-environment
      PYSPARK_SUBMIT_ARGS: --driver-memory 1g --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7 pyspark-shell
    volumes: ["grid-data:/data", "./grid:/app/grid:ro", "./tests:/app/tests:ro"]
    depends_on:
      data-init: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
    command: [python, -m, grid.stream]
    restart: unless-stopped

  batch-worker:
    image: gridpulse-spark:local
    build: {context: ., target: spark}
    environment: *app-environment
    volumes: ["grid-data:/data", "./grid:/app/grid:ro"]
    depends_on:
      data-init: {condition: service_completed_successfully}
    command: [uvicorn, grid.batch_service:app, --host, 0.0.0.0, --port, "8001", --workers, "1"]
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    depends_on:
      data-init: {condition: service_completed_successfully}
    command: [bash, -c, "airflow db migrate && (airflow users list --output json | python -c 'import json,sys; sys.exit(0 if any(u.get(\"username\") == \"admin\" for u in json.load(sys.stdin)) else 1)' || airflow users create --username admin --password admin --firstname Grid --lastname Admin --role Admin --email admin@example.test)"]

  airflow-scheduler:
    <<: *airflow
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      batch-worker: {condition: service_started}
    command: scheduler
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    command: webserver
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped

  api:
    image: gridpulse-app:local
    build: {context: ., target: app}
    environment: *app-environment
    volumes: ["./grid:/app/grid:ro"]
    depends_on:
      data-init: {condition: service_completed_successfully}
    command: [uvicorn, grid.api:app, --host, 0.0.0.0, --port, "8000"]
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped

  dashboard:
    image: gridpulse-app:local
    build: {context: ., target: app}
    environment: *app-environment
    volumes: ["./dashboard:/app/dashboard:ro", "./grid:/app/grid:ro"]
    depends_on:
      data-init: {condition: service_completed_successfully}
    command: [streamlit, run, dashboard/app.py, --server.address=0.0.0.0, --server.port=8501]
    ports: ["127.0.0.1:8501:8501"]
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  grid-data:
  airflow-logs:
